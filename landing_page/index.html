<!doctype html>
<html>
  <head>
    <!-- critical canvas color: paints before external CSS loads, prevents white flash -->
    <style>
      html { background-color: white; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background-color: rgb(17, 17, 17); } }
      /* swap pages atomically: hold the old page until the new one is ready,
         then cut over in one frame — no crossfade, no blank frame */
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    </style>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-169224616-2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-169224616-2');
    </script>

    <!-- connect to CDNs early so render-blocking CSS resolves faster
         (jsDelivr also serves the MessySharpie webfont) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Latest compiled and minified JavaScript (deferred: don't block first paint) -->
    <script defer src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.2/dist/js/bootstrap.min.js"></script>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.2/dist/css/bootstrap.min.css">

    <link href='https://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>

    <link rel="shortcut icon" href="jl_icon.png"/>

    <link href='style.css' rel='stylesheet' type='text/css'>

    <!-- a moogle walks across the bottom of the page; click it for /ffvii -->
    <script defer src="moogle.js"></script>

    <!-- pixel Jesse strolls by too; click him for lumarie.family -->
    <script defer src="jesse.js?v=12"></script>

    <!-- swap / and /about/ in place instead of a full page navigation -->
    <script defer src="nav.js"></script>

    <!-- prerender nav targets at load, not on hover: a hover-triggered prerender
         can be activated while still half-loaded, flashing a blank page. By load
         + a beat, these are fully rendered off-screen, so clicking is an instant
         complete-frame swap (Chromium); prefetch covers everything else. -->
    <script type="speculationrules">
      {
        "prerender": [{ "urls": ["/about/", "/blog/"], "eagerness": "immediate" }],
        "prefetch": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }]
      }
    </script>
    <link rel="prefetch" href="/about/">
    <link rel="prefetch" href="/blog/">

    <title>Jesse Lumarie</title>
  </head>

  <body>
   <div id="page">
    <div class="header">
    </div>


  <div class= "mini-header">
      <div class="container">
 		 <h2>This is the website of Jesse Lumarie.</h2>
      </div>
  </div>

  <div class = "main">
    <div class="container">
      <div class="row">
        <div class="col-xs-4" >
          <a class="pull-right center-block smallCircle" href="/about/">
            <div class="smallCircle-inner">About</div>
          </a>
        </div>
         <div class="col-xs-4" >
           <div class="center-block bigCircle-holder">
             <div class="bigCircle">
               <div class="bigCircle-front">JL</div>
               <div class="bigCircle-back">
                 <span class="wave">👋🏻</span>
               </div>
             </div>
           </div>
         </div>
         <div class="col-xs-4" >
          <a class="pull-left center-block smallCircle" href="/blog/">
            <div class="smallCircle-inner">Writing</div>
          </a>
         </div>
      </div>
    </div>
  </div>


  <div class= "places-text">
      <div class="container">
 		 <h3>Here are some other places you can find me:</h3>
      </div>
  </div>


    <div class ="social">
        <div class="container">

          <a href="https://instagram.com/jesselumarie" class='insta-logo social-image center-block'></a>
          <a href="https://twitter.com/jesselumarie" class='twitter-logo social-image center-block'></a>
          <a href="https://github.com/jesselumarie" class='github-logo social-image center-block'></a>
          <a href="https://www.linkedin.com/in/jesselumarie" class='linkedin-logo social-image center-block'></a>
        </div>
    </div>
   </div>
  </div>


  <div class="footer">
  </div>
   </div>

  </body>
</html>
